name: Deploy Auraluxe to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auraluxe-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Cloudflare Worker
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://jsshaoucrjorbyuzagdr.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ti84mMAfbpf5l2a6n-czjw_8OLu-OJA
          SUPABASE_URL: https://jsshaoucrjorbyuzagdr.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ti84mMAfbpf5l2a6n-czjw_8OLu-OJA

      - name: Verify browser bundle contains public Supabase configuration
        env:
          SUPABASE_URL: https://jsshaoucrjorbyuzagdr.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ti84mMAfbpf5l2a6n-czjw_8OLu-OJA
        run: |
          set -euo pipefail
          grep -R -F -- "$SUPABASE_URL" .output/public
          grep -R -F -- "$SUPABASE_PUBLISHABLE_KEY" .output/public
          echo "Public Supabase configuration is present in the generated browser assets."

      - name: Deploy existing auraluxenp Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 2a5ced50e8aafc5fbc9b0329cf25f84e
          command: deploy .output/server/index.mjs --assets .output/public --name auraluxenp --compatibility-date 2026-11-20 --compatibility-flags nodejs_compat --compatibility-flags global_fetch_strictly_public --var SUPABASE_URL:https://jsshaoucrjorbyuzagdr.supabase.co --var SUPABASE_PUBLISHABLE_KEY:sb_publishable_ti84mMAfbpf5l2a6n-czjw_8OLu-OJA --var BIZSATHI_INVENTORY_API_URL:https://bizsathi-migration.auraluxe26.workers.dev/api/public/website-inventory

      - name: Verify BizSathi inventory API URL binding on the active Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: 2a5ced50e8aafc5fbc9b0329cf25f84e
          EXPECTED_URL: https://bizsathi-migration.auraluxe26.workers.dev/api/public/website-inventory
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/auraluxenp/settings")"
          printf '%s' "$response" | jq -e --arg expected "$EXPECTED_URL" \
            '.success == true and (.result.bindings | any(.[]; .name == "BIZSATHI_INVENTORY_API_URL" and .type == "plain_text" and .text == $expected))' >/dev/null
          echo "BizSathi inventory API URL binding is present on the deployed Worker."

      - name: Verify read-only inventory auth probes reject unauthenticated requests
        run: |
          set -euo pipefail
          check_unauthenticated() {
            local url="$1"
            local status
            status="$(curl --silent --show-error --output /tmp/auth-probe-response --write-out '%{http_code}' "$url")"
            if [ "$status" != "401" ]; then
              echo "Expected HTTP 401 from read-only auth probe; received $status."
              cat /tmp/auth-probe-response
              exit 1
            fi
          }
          check_unauthenticated "https://www.auraluxe.com.np/api/public/bizsathi-inventory-auth"
          check_unauthenticated "https://bizsathi-migration.auraluxe26.workers.dev/api/public/website-inventory-auth"
          echo "Both production auth probes are reachable and reject unauthenticated requests."

      - name: Smoke-test deployed storefront and PWA icon
        run: |
          set -euo pipefail
          URL="https://auraluxenp.auraluxe-nepalgunj.workers.dev"
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 5 "$URL/" -o /tmp/auraluxe-home.html
          grep -Eiq '<!doctype html|<html' /tmp/auraluxe-home.html
          test -s /tmp/auraluxe-home.html
          curl --fail --silent --show-error "$URL/manifest.webmanifest" -o /tmp/auraluxe-manifest.json
          node -e 'const m=require("/tmp/auraluxe-manifest.json"); if (!Array.isArray(m.icons) || !m.icons.length) process.exit(1); for (const i of m.icons) if (!i.src.startsWith("/")) process.exit(2);'
          curl --fail --silent --show-error "$URL/favicon.png" -o /tmp/auraluxe-favicon.png
          file /tmp/auraluxe-favicon.png | grep -q 'PNG image data'
          echo "Storefront HTML, manifest, and icon all returned valid responses."
