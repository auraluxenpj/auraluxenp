name: Storefront verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/biba-inspired-auraluxe-home]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: ESLint changed storefront files
        run: bunx eslint src/components/site/Header.tsx src/components/site/ProductCard.tsx src/lib/data.ts src/routes/index.tsx src/routes/shop.index.tsx 'src/routes/shop.product.$slug.tsx' --rule=prettier/prettier:off

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Production build
        run: bun run build
