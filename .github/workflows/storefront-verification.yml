name: Storefront verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/biba-inspired-auraluxe-home, feature/auraluxe-hybrid-fashion-storefront]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: ESLint changed storefront files
        run: bunx eslint src/components/site/Header.tsx src/components/site/ProductCard.tsx src/lib/data.ts src/lib/i18n.tsx src/lib/category-management.ts src/routes/index.tsx src/routes/shop.index.tsx 'src/routes/shop.product.$slug.tsx' 'src/routes/_authenticated/admin.products.$id.tsx' src/routes/_authenticated/admin.categories.tsx src/lib/inventory-sync.ts src/lib/inventory-sync.test.ts src/lib/bizsathi-stock-baseline.functions.ts src/routes/_authenticated/admin.inventory-health.tsx --rule=prettier/prettier:off
      - name: Run inventory sync endpoint tests
        run: bunx vitest run src/lib/inventory-sync.test.ts

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Production build
        run: bun run build
