name: Drizzle isolated baseline validation

on:
  push:
    branches: [main]
    paths:
      - "drizzle/migrations/**"
      - "drizzle.config.ts"
      - ".github/workflows/drizzle-baseline.yml"
  pull_request:
    paths:
      - "drizzle/migrations/**"
      - "drizzle.config.ts"
      - ".github/workflows/drizzle-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drizzle-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  introspect:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: auraluxe_baseline
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d auraluxe_baseline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auraluxe_baseline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Create minimal Supabase-compatible prerequisites
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN BYPASSRLS; END IF;
          END
          $$;

          CREATE SCHEMA auth;
          CREATE TABLE auth.users (
            id uuid PRIMARY KEY,
            email text,
            raw_user_meta_data jsonb NOT NULL DEFAULT '{}'::jsonb
          );
          CREATE OR REPLACE FUNCTION auth.uid()
          RETURNS uuid
          LANGUAGE sql STABLE
          AS $function$
            SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid
          $function$;
          CREATE OR REPLACE FUNCTION auth.role()
          RETURNS text
          LANGUAGE sql STABLE
          AS $function$
            SELECT COALESCE(
              NULLIF(current_setting('request.jwt.claim.role', true), ''),
              NULLIF(current_setting('request.jwt.claims', true), '')::jsonb ->> 'role'
            )
          $function$;

          CREATE SCHEMA storage;
          CREATE TABLE storage.objects (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            bucket_id text NOT NULL,
            name text NOT NULL
          );
          GRANT USAGE ON SCHEMA auth, storage TO anon, authenticated, service_role;
          GRANT SELECT, INSERT, UPDATE, DELETE ON storage.objects TO anon, authenticated, service_role;
          SQL

      - name: Apply the 26 repository migrations to the temporary database
        run: |
          set -euo pipefail
          shopt -s nullglob
          migrations=(drizzle/migrations/[0-9][0-9][0-9][0-9]_*.sql)
          if [ "${#migrations[@]}" -ne 26 ]; then
            echo "Expected exactly 26 numbered SQL migrations; found ${#migrations[@]}."
            exit 1
          fi
          for migration in "${migrations[@]}"; do
            echo "Applying $migration to ephemeral PostgreSQL"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Verify security migration behavior in the temporary database
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users (id, email, raw_user_meta_data)
          VALUES
            ('00000000-0000-0000-0000-000000000001', 'admin@example.invalid', '{}'::jsonb),
            ('00000000-0000-0000-0000-000000000002', 'customer@example.invalid', '{}'::jsonb)
          ON CONFLICT (id) DO NOTHING;

          INSERT INTO public.user_roles (user_id, role)
          VALUES
            ('00000000-0000-0000-0000-000000000001', 'admin'),
            ('00000000-0000-0000-0000-000000000002', 'customer')
          ON CONFLICT (user_id, role) DO NOTHING;

          DO $test$
          BEGIN
            PERFORM set_config('request.jwt.claim.sub', '00000000-0000-0000-0000-000000000002', false);
            IF public.has_role('00000000-0000-0000-0000-000000000002', 'customer') IS NOT TRUE THEN
              RAISE EXCEPTION 'A user must be able to verify their own role';
            END IF;
            IF public.has_role('00000000-0000-0000-0000-000000000001', 'admin') IS NOT FALSE THEN
              RAISE EXCEPTION 'A non-admin must not query another user role';
            END IF;

            PERFORM set_config('request.jwt.claim.sub', '00000000-0000-0000-0000-000000000001', false);
            IF public.has_role('00000000-0000-0000-0000-000000000002', 'customer') IS NOT TRUE THEN
              RAISE EXCEPTION 'An admin must retain cross-user role lookup';
            END IF;

            PERFORM set_config('request.jwt.claim.sub', '', false);
            IF public.has_role('00000000-0000-0000-0000-000000000002', 'customer') IS NOT FALSE THEN
              RAISE EXCEPTION 'An anonymous caller must not query arbitrary user roles';
            END IF;

            IF has_function_privilege('anon', 'public.complete_pos_sale(jsonb)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Anonymous POS execution must be revoked';
            END IF;
            IF NOT has_function_privilege('authenticated', 'public.complete_pos_sale(jsonb)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Authenticated POS execution must remain available';
            END IF;
            IF NOT has_function_privilege('anon', 'public.place_order(text,text,jsonb,jsonb,text,uuid)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Guest checkout must remain available';
            END IF;
            IF NOT has_function_privilege('anon', 'public.track_order(text,text)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Guest order tracking must remain available';
            END IF;
            IF has_function_privilege('authenticated', 'public.audit_payment_settings()', 'EXECUTE') THEN
              RAISE EXCEPTION 'Trigger helper direct execution must be revoked';
            END IF;
            IF has_function_privilege('authenticated', 'public.inv_sync_push(jsonb)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Inventory sync must remain unavailable to browser users';
            END IF;
            IF NOT has_function_privilege('service_role', 'public.inv_sync_push(jsonb)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Service-role inventory sync access must remain available';
            END IF;
            IF public.website_inventory_authority_enabled() IS NOT FALSE THEN
              RAISE EXCEPTION 'BizSathi authority must remain disabled until cutover approval';
            END IF;
            IF has_function_privilege('anon', 'public.register_website_inventory_proof(uuid,text,text)', 'EXECUTE')
               OR has_function_privilege('authenticated', 'public.register_website_inventory_proof(uuid,text,text)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Browser users must not register inventory reservation proofs';
            END IF;
            IF NOT has_function_privilege('service_role', 'public.register_website_inventory_proof(uuid,text,text)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Service role must register server-side inventory proofs';
            END IF;
            IF has_function_privilege('anon', 'public.bizsathi_inventory_projection_state(text[])', 'EXECUTE')
               OR has_function_privilege('authenticated', 'public.bizsathi_inventory_projection_state(text[])', 'EXECUTE')
               OR has_function_privilege('anon', 'public.bizsathi_inventory_project(jsonb)', 'EXECUTE')
               OR has_function_privilege('authenticated', 'public.bizsathi_inventory_project(jsonb)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Browser users must not call BizSathi projection RPCs';
            END IF;
            IF NOT has_function_privilege('service_role', 'public.bizsathi_inventory_projection_state(text[])', 'EXECUTE')
               OR NOT has_function_privilege('service_role', 'public.bizsathi_inventory_project(jsonb)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Service role must own BizSathi projection RPC access';
            END IF;
            IF has_table_privilege('authenticated', 'public.website_inventory_reservation_proofs', 'SELECT') THEN
              RAISE EXCEPTION 'Browser users must not read inventory reservation proofs';
            END IF;
            IF (SELECT count(*) FROM pg_trigger WHERE tgname IN ('bizsathi_authority_product_stock_guard','bizsathi_authority_variant_stock_guard') AND NOT tgisinternal) <> 2 THEN
              RAISE EXCEPTION 'Both legacy website stock writers must be guarded at cutover';
            END IF;
          END
          $test$;
          SQL


      - name: Verify BizSathi draft catalogue import is service-only and never writes stock
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $test$
          DECLARE
            product_id uuid := '11111111-1111-4111-8111-111111111111';
            variant_id uuid := '22222222-2222-4222-8222-222222222222';
            payload jsonb;
            result jsonb;
          BEGIN
            IF has_function_privilege('authenticated', 'public.upsert_bizsathi_catalogue_drafts(jsonb)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Authenticated browser users must not execute catalogue import';
            END IF;
            IF NOT has_function_privilege('service_role', 'public.upsert_bizsathi_catalogue_drafts(jsonb)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Service role must execute catalogue import';
            END IF;

            payload := jsonb_build_array(jsonb_build_object(
              'product_id', product_id,
              'variant_id', variant_id,
              'name', 'Integration Test Dress',
              'category', 'Dress',
              'variant_name', 'Standard',
              'model_code', 'MODEL-TEST-001',
              'sku', 'AL-INTEGRATION-TEST-001',
              'selling_price', 1200
            ));

            result := public.upsert_bizsathi_catalogue_drafts(payload);
            IF (result->>'created_products')::integer <> 1
               OR (result->>'created_variants')::integer <> 1
               OR result->>'stock_imported' <> 'false'
               OR result->>'products_published' <> 'false' THEN
              RAISE EXCEPTION 'Catalogue import did not create a safe unpublished draft';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM public.products
               WHERE bizsathi_product_id = product_id
                 AND is_published = false AND stock = 0 AND model_code = 'MODEL-TEST-001'
            ) THEN
              RAISE EXCEPTION 'New catalogue product must remain unpublished with zero local stock';
            END IF;

            UPDATE public.products SET is_published = true, stock = 7
             WHERE bizsathi_product_id = product_id;
            UPDATE public.product_variants SET stock = 5
             WHERE bizsathi_variant_id = variant_id;

            result := public.upsert_bizsathi_catalogue_drafts(payload);
            IF (result->>'updated_products')::integer <> 1
               OR (result->>'updated_variants')::integer <> 1 THEN
              RAISE EXCEPTION 'Repeat import must update existing source mappings';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM public.products
               WHERE bizsathi_product_id = product_id
                 AND is_published = true AND stock = 7
            ) OR NOT EXISTS (
              SELECT 1 FROM public.product_variants
               WHERE bizsathi_variant_id = variant_id AND stock = 5 AND bizsathi_model_code = 'MODEL-TEST-001'
            ) THEN
              RAISE EXCEPTION 'Repeat import must preserve publication state and local stock';
            END IF;
          END
          $test$;
          SQL


      - name: Verify shared catalogue import is SKU-first and permits duplicate Model Codes
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $test$
          DECLARE
            payload jsonb;
            result jsonb;
            first_product uuid;
            first_variant uuid;
          BEGIN
            IF has_function_privilege('authenticated', 'public.upsert_shared_catalogue_from_bizsathi(jsonb)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Browser users must not execute shared catalogue import';
            END IF;
            IF NOT has_function_privilege('service_role', 'public.upsert_shared_catalogue_from_bizsathi(jsonb)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Service role must execute shared catalogue import';
            END IF;

            payload := jsonb_build_array(
              jsonb_build_object('product_id','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
                'variant_id','bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb','name','Shared Test One',
                'category','Test Category','variant_name','Standard','model_code','DUPLICATE-MODEL',
                'sku','SYNC-TEST-ONE','unit','pcs','sizes',jsonb_build_array('M','L'),
                'purchase_price',500,'mrp',1500,'selling_price',1000,'wholesale_price',800,
                'reorder_level',2,'published',false,'barcode','SYNC-TEST-BAR-1'),
              jsonb_build_object('product_id','cccccccc-cccc-4ccc-8ccc-cccccccccccc',
                'variant_id','dddddddd-dddd-4ddd-8ddd-dddddddddddd','name','Shared Test Two',
                'category','Test Category','variant_name','Standard','model_code','DUPLICATE-MODEL',
                'sku','SYNC-TEST-TWO','unit','pcs','sizes',jsonb_build_array('STANDARD'),
                'purchase_price',600,'mrp',1600,'selling_price',1100,'wholesale_price',850,
                'reorder_level',3,'published',false,'barcode','SYNC-TEST-BAR-2')
            );
            result := public.upsert_shared_catalogue_from_bizsathi(payload);
            IF result->>'identity_key' <> 'sku' OR result->>'model_code_unique' <> 'false'
               OR (result->>'created_products')::integer <> 2
               OR (result->>'created_variants')::integer <> 2 THEN
              RAISE EXCEPTION 'SKU-first import did not accept repeated Model Code values';
            END IF;
            SELECT p.id,pv.id INTO first_product,first_variant
              FROM public.products p JOIN public.product_variants pv ON pv.product_id=p.id
             WHERE pv.sku='SYNC-TEST-ONE';
            UPDATE public.products SET description='Website copy retained',meta_title='Keep this title',stock=7 WHERE id=first_product;
            UPDATE public.product_variants SET stock=5 WHERE id=first_variant;
            payload := jsonb_build_array(jsonb_build_object(
              'product_id','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
              'variant_id','bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb','name','Updated Test One',
              'category','Test Category','variant_name','Standard','model_code','DUPLICATE-MODEL',
              'sku','SYNC-TEST-ONE','unit','pcs','sizes',jsonb_build_array('M','L'),
              'purchase_price',550,'mrp',1550,'selling_price',1050,'wholesale_price',825,
              'reorder_level',2,'published',false,'barcode','SYNC-TEST-BAR-1'
            ));
            result := public.upsert_shared_catalogue_from_bizsathi(payload);
            IF (result->>'updated_products')::integer <> 1
               OR (result->>'updated_variants')::integer <> 1 THEN
              RAISE EXCEPTION 'Repeat import did not update by SKU';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM public.products WHERE id=first_product AND stock=7
              AND description='Website copy retained' AND meta_title='Keep this title') THEN
              RAISE EXCEPTION 'Catalogue import overwrote stock or website enrichment';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM public.product_variants WHERE id=first_variant AND stock=5
              AND purchase_price=550 AND mrp=1550 AND wholesale_price=825) THEN
              RAISE EXCEPTION 'Catalogue import did not update commercial fields or changed stock';
            END IF;
            IF (SELECT count(*) FROM public.products WHERE model_code='DUPLICATE-MODEL')<>2 THEN
              RAISE EXCEPTION 'Repeated Model Code values must remain valid';
            END IF;
          END
          $test$;
          SQL

      - name: Verify checkout captures BizSathi identity and enqueues a PII-minimized idempotent event
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $test$
          DECLARE
            product_id uuid;
            variant_id uuid;
            order_result jsonb;
            duplicate_result jsonb;
            customer jsonb := jsonb_build_object(
              'customer_name', 'Integration Test',
              'customer_phone', '123456789',
              'customer_email', null,
              'address', 'Test address',
              'city', 'Nepalgunj',
              'state', null,
              'country', 'Nepal',
              'postal_code', null,
              'delivery_notes', null
            );
            items jsonb;
            checkout_key text := 'integration-checkout-key-0001';
          BEGIN
            ALTER TABLE public.payment_settings DISABLE TRIGGER payment_settings_audit_trigger;
            UPDATE public.payment_settings
               SET qr_enabled = true,
                   qr_image_path = 'integration-test-qr.png',
                   qr_merchant_name = 'Integration Test Merchant'
             WHERE id = 'main';
            ALTER TABLE public.payment_settings ENABLE TRIGGER payment_settings_audit_trigger;

            INSERT INTO public.products (
              name, slug, price, stock, sizes, colors, images, is_published, bizsathi_product_id
            ) VALUES (
              'Mapped Checkout Test', 'mapped-checkout-test', 1200, 5, '{}', '{}', '{}', true,
              '33333333-3333-4333-8333-333333333333'
            ) RETURNING id INTO product_id;

            INSERT INTO public.product_variants (
              product_id, size, color, sku, stock, bizsathi_variant_id, bizsathi_variant_name, bizsathi_model_code
            ) VALUES (
              product_id, null, null, 'AL-CHECKOUT-TEST-001', 0,
              '44444444-4444-4444-8444-444444444444', 'Standard', 'MODEL-CHECKOUT-001'
            ) RETURNING id INTO variant_id;

            items := jsonb_build_array(jsonb_build_object(
              'product_id', product_id,
              'size', null,
              'color', null,
              'quantity', 1
            ));

            BEGIN
              PERFORM public.place_order('integration-checkout-disabled-0001', 'qr', customer, items, null);
              RAISE EXCEPTION 'Mapped checkout should remain blocked until reservations are activated';
            EXCEPTION WHEN raise_exception THEN
              IF SQLERRM NOT LIKE 'Online checkout for this product is paused%' THEN
                RAISE;
              END IF;
            END;
            IF EXISTS (SELECT 1 FROM public.orders AS o WHERE o.checkout_key = 'integration-checkout-disabled-0001') THEN
              RAISE EXCEPTION 'Disabled mapped checkout must not create an order';
            END IF;

            UPDATE public.bizsathi_checkout_reservation_config SET enabled = true WHERE id = 1;

            order_result := public.place_order(checkout_key, 'qr', customer, items, null);
            IF order_result->>'duplicate' <> 'false' THEN
              RAISE EXCEPTION 'First checkout must create a new order';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM public.order_items
               WHERE order_id = (order_result->>'order_id')::uuid
                 AND bizsathi_product_id = '33333333-3333-4333-8333-333333333333'
                 AND bizsathi_variant_id = '44444444-4444-4444-8444-444444444444'
                 AND source_sku = 'AL-CHECKOUT-TEST-001'
            ) THEN
              RAISE EXCEPTION 'Checkout line must preserve the verified BizSathi product, variant and SKU';
            END IF;

            IF (SELECT count(*) FROM public.bizsathi_inventory_outbox
                 WHERE idempotency_key = 'order-item-created:' ||
                   (SELECT id::text FROM public.order_items WHERE order_id = (order_result->>'order_id')::uuid)) <> 1 THEN
              RAISE EXCEPTION 'Mapped checkout line must create one durable outbox event';
            END IF;

            IF EXISTS (
              SELECT 1 FROM public.bizsathi_inventory_outbox
               WHERE order_id = (order_result->>'order_id')::uuid
                 AND (payload ? 'customer_name' OR payload ? 'customer_phone' OR payload ? 'customer_email' OR payload ? 'address')
            ) THEN
              RAISE EXCEPTION 'Inventory outbox must not contain customer personal data';
            END IF;

            duplicate_result := public.place_order(checkout_key, 'qr', customer, items, null);
            IF duplicate_result->>'duplicate' <> 'true'
               OR duplicate_result->>'order_id' <> order_result->>'order_id' THEN
              RAISE EXCEPTION 'Repeated checkout must return the original order';
            END IF;

            INSERT INTO public.product_variants (
              product_id, size, color, sku, stock, bizsathi_variant_id, bizsathi_variant_name
            ) VALUES (
              product_id, null, null, 'AL-CHECKOUT-TEST-002', 0,
              '55555555-5555-4555-8555-555555555555', 'Standard'
            );

            BEGIN
              PERFORM public.place_order('integration-checkout-key-0002', 'qr', customer, items, null);
              RAISE EXCEPTION 'Ambiguous variant mapping should have rejected checkout';
            EXCEPTION WHEN raise_exception THEN
              IF SQLERRM NOT LIKE 'Inventory mapping is missing or ambiguous%' THEN
                RAISE;
              END IF;
            END;

            IF EXISTS (SELECT 1 FROM public.orders AS o WHERE o.checkout_key = 'integration-checkout-key-0002') THEN
              RAISE EXCEPTION 'Rejected ambiguous checkout must not leave an order';
            END IF;
            UPDATE public.bizsathi_checkout_reservation_config SET enabled = false WHERE id = 1;
          END
          $test$;
          SQL

      - name: Generate Drizzle schema and snapshot in a temporary output directory
        run: |
          set -euo pipefail
          cat > drizzle.baseline.config.ts <<'CONFIG'
          import { defineConfig } from "drizzle-kit";

          export default defineConfig({
            dialect: "postgresql",
            schema: "./.drizzle-baseline/schema.ts",
            out: "./.drizzle-baseline/migrations",
            schemaFilter: ["public", "auth"],
            dbCredentials: {
              url: process.env.DATABASE_URL ?? "",
            },
          });
          CONFIG
          bunx drizzle-kit pull --config=drizzle.baseline.config.ts

      - name: Repair and validate generated TypeScript baseline
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          schema = Path(".drizzle-baseline/migrations/schema.ts")
          source = schema.read_text()
          # drizzle-kit 0.31.11 emits an unterminated default for empty-string
          # PostgreSQL defaults. Normalize only this exact malformed sequence.
          repaired = source.count("default(').notNull()")
          source = source.replace("default(').notNull()", "default('').notNull()")
          schema.write_text(source)

          if "default(')" in source:
              raise SystemExit("Malformed empty-string default remains in generated schema.")
          if not re.search(r"export const usersInAuth\s*=", source):
              raise SystemExit("auth.users was not introspected; cross-schema FK targets would be unresolved.")
          if not re.search(r"export const appRole\s*=", source):
              raise SystemExit("Expected public enum app_role is missing.")
          if len(re.findall(r"= pgTable\(", source)) < 27:
              raise SystemExit("Expected at least 27 public tables in generated schema.")
          print(f"Normalized {repaired} empty-string defaults; generated schema contains auth.users and public tables.")
          PY
          test -s .drizzle-baseline/migrations/relations.ts
          test -s .drizzle-baseline/migrations/meta/_journal.json
          bunx tsc --noEmit --skipLibCheck --target ES2022 --module ESNext --moduleResolution bundler .drizzle-baseline/migrations/schema.ts .drizzle-baseline/migrations/relations.ts
          find .drizzle-baseline -maxdepth 4 -type f -print

      - name: Upload generated baseline for review (not committed or deployed)
        uses: actions/upload-artifact@v4
        with:
          name: auraluxe-drizzle-baseline
          path: .drizzle-baseline/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
