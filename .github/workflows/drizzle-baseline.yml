name: Drizzle isolated baseline validation

on:
  push:
    branches: [main]
    paths:
      - "drizzle/migrations/**"
      - "drizzle.config.ts"
      - ".github/workflows/drizzle-baseline.yml"
  pull_request:
    paths:
      - "drizzle/migrations/**"
      - "drizzle.config.ts"
      - ".github/workflows/drizzle-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drizzle-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  introspect:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: auraluxe_baseline
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d auraluxe_baseline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auraluxe_baseline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Create minimal Supabase-compatible prerequisites
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN BYPASSRLS; END IF;
          END
          $$;

          CREATE SCHEMA auth;
          CREATE TABLE auth.users (
            id uuid PRIMARY KEY,
            email text,
            raw_user_meta_data jsonb NOT NULL DEFAULT '{}'::jsonb
          );
          CREATE OR REPLACE FUNCTION auth.uid()
          RETURNS uuid
          LANGUAGE sql STABLE
          AS $function$
            SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid
          $function$;

          CREATE SCHEMA storage;
          CREATE TABLE storage.objects (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            bucket_id text NOT NULL,
            name text NOT NULL
          );
          GRANT USAGE ON SCHEMA auth, storage TO anon, authenticated, service_role;
          GRANT SELECT, INSERT, UPDATE, DELETE ON storage.objects TO anon, authenticated, service_role;
          SQL

      - name: Apply the 21 repository migrations to the temporary database
        run: |
          set -euo pipefail
          shopt -s nullglob
          migrations=(drizzle/migrations/[0-9][0-9][0-9][0-9]_*.sql)
          if [ "${#migrations[@]}" -ne 21 ]; then
            echo "Expected exactly 21 numbered SQL migrations; found ${#migrations[@]}."
            exit 1
          fi
          for migration in "${migrations[@]}"; do
            echo "Applying $migration to ephemeral PostgreSQL"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Verify security migration behavior in the temporary database
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users (id, email, raw_user_meta_data)
          VALUES
            ('00000000-0000-0000-0000-000000000001', 'admin@example.invalid', '{}'::jsonb),
            ('00000000-0000-0000-0000-000000000002', 'customer@example.invalid', '{}'::jsonb)
          ON CONFLICT (id) DO NOTHING;

          INSERT INTO public.user_roles (user_id, role)
          VALUES
            ('00000000-0000-0000-0000-000000000001', 'admin'),
            ('00000000-0000-0000-0000-000000000002', 'customer')
          ON CONFLICT (user_id, role) DO NOTHING;

          DO $test$
          BEGIN
            PERFORM set_config('request.jwt.claim.sub', '00000000-0000-0000-0000-000000000002', false);
            IF public.has_role('00000000-0000-0000-0000-000000000002', 'customer') IS NOT TRUE THEN
              RAISE EXCEPTION 'A user must be able to verify their own role';
            END IF;
            IF public.has_role('00000000-0000-0000-0000-000000000001', 'admin') IS NOT FALSE THEN
              RAISE EXCEPTION 'A non-admin must not query another user role';
            END IF;

            PERFORM set_config('request.jwt.claim.sub', '00000000-0000-0000-0000-000000000001', false);
            IF public.has_role('00000000-0000-0000-0000-000000000002', 'customer') IS NOT TRUE THEN
              RAISE EXCEPTION 'An admin must retain cross-user role lookup';
            END IF;

            PERFORM set_config('request.jwt.claim.sub', '', false);
            IF public.has_role('00000000-0000-0000-0000-000000000002', 'customer') IS NOT FALSE THEN
              RAISE EXCEPTION 'An anonymous caller must not query arbitrary user roles';
            END IF;

            IF has_function_privilege('anon', 'public.complete_pos_sale(jsonb)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Anonymous POS execution must be revoked';
            END IF;
            IF NOT has_function_privilege('authenticated', 'public.complete_pos_sale(jsonb)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Authenticated POS execution must remain available';
            END IF;
            IF NOT has_function_privilege('anon', 'public.place_order(text,text,jsonb,jsonb,text)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Guest checkout must remain available';
            END IF;
            IF NOT has_function_privilege('anon', 'public.track_order(text,text)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Guest order tracking must remain available';
            END IF;
            IF has_function_privilege('authenticated', 'public.audit_payment_settings()', 'EXECUTE') THEN
              RAISE EXCEPTION 'Trigger helper direct execution must be revoked';
            END IF;
            IF has_function_privilege('authenticated', 'public.inv_sync_push(jsonb)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Inventory sync must remain unavailable to browser users';
            END IF;
            IF NOT has_function_privilege('service_role', 'public.inv_sync_push(jsonb)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Service-role inventory sync access must remain available';
            END IF;
          END
          $test$;
          SQL

      - name: Generate Drizzle schema and snapshot in a temporary output directory
        run: |
          set -euo pipefail
          cat > drizzle.baseline.config.ts <<'CONFIG'
          import { defineConfig } from "drizzle-kit";

          export default defineConfig({
            dialect: "postgresql",
            schema: "./.drizzle-baseline/schema.ts",
            out: "./.drizzle-baseline/migrations",
            schemaFilter: ["public", "auth"],
            dbCredentials: {
              url: process.env.DATABASE_URL ?? "",
            },
          });
          CONFIG
          bunx drizzle-kit pull --config=drizzle.baseline.config.ts

      - name: Repair and validate generated TypeScript baseline
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          schema = Path(".drizzle-baseline/migrations/schema.ts")
          source = schema.read_text()
          # drizzle-kit 0.31.11 emits an unterminated default for empty-string
          # PostgreSQL defaults. Normalize only this exact malformed sequence.
          repaired = source.count("default(').notNull()")
          source = source.replace("default(').notNull()", "default('').notNull()")
          schema.write_text(source)

          if "default(')" in source:
              raise SystemExit("Malformed empty-string default remains in generated schema.")
          if not re.search(r"export const usersInAuth\s*=", source):
              raise SystemExit("auth.users was not introspected; cross-schema FK targets would be unresolved.")
          if not re.search(r"export const appRole\s*=", source):
              raise SystemExit("Expected public enum app_role is missing.")
          if len(re.findall(r"= pgTable\(", source)) < 27:
              raise SystemExit("Expected at least 27 public tables in generated schema.")
          print(f"Normalized {repaired} empty-string defaults; generated schema contains auth.users and public tables.")
          PY
          test -s .drizzle-baseline/migrations/relations.ts
          test -s .drizzle-baseline/migrations/meta/_journal.json
          bunx tsc --noEmit --skipLibCheck --target ES2022 --module ESNext --moduleResolution bundler .drizzle-baseline/migrations/schema.ts .drizzle-baseline/migrations/relations.ts
          find .drizzle-baseline -maxdepth 4 -type f -print

      - name: Upload generated baseline for review (not committed or deployed)
        uses: actions/upload-artifact@v4
        with:
          name: auraluxe-drizzle-baseline
          path: .drizzle-baseline/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
